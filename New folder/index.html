<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razor - Agent Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">Razor <span>Sales@Razor.uk ▼</span></div>
  <div class="nav">
    <button class="btn-link">◍</button>
    <button class="btn-link">Sign up</button>
    <button class="btn-demo">Request Demo</button>
  </div>
</header>

<div class="wrapper">
  <!-- Left deco -->
  <div class="illust left">
    <div class="dot-box"></div>
  </div>
  
  <div class="card">
    <h2>Agent Login</h2>
    <p class="sub">Hey, Enter your details to get sign in<br>to your account</p>
    
    <div class="input-wrap">
      <input class="input" placeholder="Enter Email / Phone No">
    </div>
    <div class="input-wrap">
      <input class="input" type="password" placeholder="Passcode">
      <span class="hide">Hide</span>
    </div>
    <div class="trouble">Having trouble in sign in?</div>
    
    <button class="btn-sign">Sign in</button>
    <div class="divider">— Or Sign in with —</div>
    
    <div class="socials">
      <div class="social">G Google</div>
      <div class="social"> Apple ID</div>
      <div class="social">f Facebook</div>
    </div>
    <div class="request">Don't have an account? <a href="#">Request Now</a></div>
  </div>

 
</div>

<footer>Copyright @ework 2022 | Privacy Policy</footer>

</body>
</html>
